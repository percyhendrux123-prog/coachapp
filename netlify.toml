# Build: checks settings, builds the app, and on production deploys installs the server
# functions into Supabase (see scripts/netlify-build.mjs). The functions dir holds the one
# Netlify function (the AI-connector OAuth surface).
[build]
  command = "node scripts/netlify-build.mjs"
  publish = "dist"
  functions = "netlify/functions"

# OAuth discovery documents are extensionless — force application/json.
[[headers]]
  for = "/.well-known/oauth-protected-resource"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/.well-known/oauth-authorization-server"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# "Deploy to Netlify" button: the form asks for these by name. The text is the label shown.
# Full walkthrough: SETUP.md.
[template.environment]
  VITE_SUPABASE_URL = "Supabase Project URL, e.g. https://abcdefghijklmnopqrst.supabase.co (Supabase: Project Overview, Copy next to the address)"
  VITE_SUPABASE_ANON_KEY = "Supabase anon public key, starts with eyJ (Supabase: Project Settings > API Keys > View legacy API keys)"
  SUPABASE_ACCESS_TOKEN = "Supabase access token, starts with sbp_, lets the deploy install the server functions (supabase.com/dashboard/account/tokens: Expires Never, your project, Full access)"
